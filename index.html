<!DOCTYPE html>
<html lang="en">
<head>
  <title>CoastLink Community Dashboard</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f8f9fa; }
    h1 { text-align: center; color: #333; }
    #map { height: 500px; margin-bottom: 20px; border: 1px solid #ccc; }
    #alerts { max-width: 800px; margin: 0 auto; }
    .alert-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .alert-title { font-size: 1.2em; margin: 0 0 8px; color: #d32f2f; }
    .alert-meta { color: #666; font-size: 0.9em; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>🌊 CoastLink Community Dashboard</h1>
  <div id="map"></div>
  <div id="alerts">
    <h2>Recent Alerts</h2>
    <div id="alert-list"></div>
  </div>

  <script>
    // === Initialize Map ===
    const map = L.map('map').setView([-30.85, 30.35], 12); // Center on South Coast approx
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // === Zone fallback centers (add more as needed) ===
    const zoneCenters = {
      "Highway West": [-30.464248, 30.637618],
      "River North": [-30.82, 30.38],
      "River South": [-30.88, 30.32],
      "Sea East": [-30.90, 30.45],
      "Central": [-30.85, 30.35]
      // Add your other zones here
    };

    // === Load data from your public Sheet JSON feed ===
    const SHEET_ID = "1Bi9g1mnhkHFqqvNhIwQkikJ2gDkJx5xk5jheyu0kAE4"; // ← YOUR SHEET ID HERE
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Form%20Responses%201&tq=SELECT%20*%20WHERE%20Col6%20IS%20NOT%20NULL%20LIMIT%2010`;

    fetch(url)
  .then(response => {
    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
    return response.text();
  })
  .then(text => {
    // Remove the /*O_o*/ prefix if present, then remove the function wrapper
    let cleaned = text
      .replace(/^\/\*(.|\n)*?\*\//, '')          // Remove any leading /* ... */ comment block
      .trim()
      .replace(/^google\.visualization\.Query\.setResponse\(/, '')
      .replace(/\);?$/, '');                     // Remove trailing ); or ;

    // Safety check: if still starts with / or looks wrong, log it
    if (cleaned.startsWith('/') || cleaned.startsWith('<')) {
      throw new Error('Response still not clean JSON: ' + cleaned.substring(0, 100));
    }

    const data = JSON.parse(cleaned);
    const rows = data.table.rows || [];

    // === YOUR EXISTING PROCESSING CODE GOES HERE (do NOT delete this part) ===
    rows.forEach(row => {
      const cells = row.c || [];
      const timestamp = cells[0]?.v || '';
      const reporter = cells[1]?.v || 'Anonymous';
      const zone = cells[3]?.v || 'Unknown';
      const spotDesc = cells[4]?.v || '';
      const combinedCoords = cells[5]?.v || ''; // Your F column
      const alertType = cells[6]?.v || '';
      const details = cells[7]?.v || '';
      const photo = cells[8]?.v || '';
      const notes = cells[9]?.v || '';

      // Parse lat/lng from combined string
      let lat = null, lng = null;
      if (combinedCoords && combinedCoords.includes(',')) {
        const parts = combinedCoords.split(',').map(s => parseFloat(s.trim()));
        if (!isNaN(parts[0]) && !isNaN(parts[1])) {
          lat = parts[0];
          lng = parts[1];
        }
      }

      // Fallback to zone center if no valid coords
      if (lat === null || lng === null) {
        const center = zoneCenters[zone] || [-30.85, 30.35];
        lat = center[0];
        lng = center[1];
      }

      // Add marker
      const marker = L.marker([lat, lng]).addTo(map);
      const popupText = `
        <b>${alertType} - ${zone}</b><br>
        ${spotDesc}<br>
        ${details.substring(0, 150)}${details.length > 150 ? '...' : ''}<br>
        Reported: ${timestamp}<br>
        By: ${reporter}<br>
        ${photo ? `<a href="${photo}" target="_blank">View Photo</a>` : ''}
      `;
      marker.bindPopup(popupText);

      // Add to alerts list below map
      const card = document.createElement('div');
      card.className = 'alert-card';
      card.innerHTML = `
        <div class="alert-title">${alertType} in ${zone}</div>
        <div class="alert-meta">Reported ${timestamp} by ${reporter}</div>
        <p>${details}</p>
        ${spotDesc ? `<p><i>Location: ${spotDesc}</i></p>` : ''}
        ${photo ? `<p><a href="${photo}" target="_blank">Photo</a></p>` : ''}
      `;
      document.getElementById('alert-list').appendChild(card);
    });

    // Zoom to fit all markers if any
    if (rows.length > 0) {
      const group = L.featureGroup(rows.map(r => {
        const cells = r.c || [];
        const combined = cells[5]?.v || '';
        let lat = null, lng = null;
        if (combined && combined.includes(',')) {
          const parts = combined.split(',').map(s => parseFloat(s.trim()));
          if (!isNaN(parts[0]) && !isNaN(parts[1])) {
            lat = parts[0];
            lng = parts[1];
          }
        }
        if (lat === null || lng === null) {
          const zone = cells[3]?.v || 'Unknown';
          const center = zoneCenters[zone] || [-30.85, 30.35];
          lat = center[0];
          lng = center[1];
        }
        return L.marker([lat, lng]);
      }));
      map.fitBounds(group.getBounds());
    }
  })
  .catch(err => {
    console.error('Error loading Sheet data:', err);
    document.getElementById('alert-list').innerHTML =
      '<p style="color:red; text-align:center;">Error loading alerts: ' + err.message + '<br>Check console or Sheet publish settings.</p>';
  });
      .catch(err => {
        console.error('Error loading Sheet data:', err);
        document.getElementById('alert-list').innerHTML = '<p style="color:red;">Error loading alerts — check console.</p>';
      });
  </script>
</body>
</html>
